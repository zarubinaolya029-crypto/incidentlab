name: Deploy IncidentLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          cat > incidentlab-config.js <<EOF
          window.INCIDENTLAB_SUPABASE_URL = 'https://oyygnvxumulvoonkyoal.supabase.co';
          window.INCIDENTLAB_SUPABASE_KEY = '$SUPABASE_PUBLISHABLE_KEY';
          EOF

      - name: Enable nickname onboarding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'id="nicknameModal"' not in s:
              s = s.replace('</head>', '<script src="incidentlab-config.js"></script></head>', 1)
              s = s.replace('</style>', '''
          #nicknameModal{position:fixed;inset:0;background:rgba(4,7,10,.88);display:flex;align-items:center;justify-content:center;z-index:20}
          #nicknameModal.hidden{display:none}
          .nicknameBox{width:min(420px,calc(100% - 32px));background:#10151b;border:1px solid #26313d;border-radius:12px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
          .nicknameBox h2{margin:0 0 8px}.nicknameBox p{color:#82909f;line-height:1.5}.nicknameInput{width:100%;padding:11px;border:1px solid #26313d;border-radius:7px;background:#070a0d;color:#fff;font:14px ui-monospace,Consolas,monospace;outline:none}.nicknameError{color:#ff7777;min-height:20px;margin-top:8px}.nicknameActions{margin-top:12px;text-align:right}
          .prompt[data-user]{font-size:0}.prompt[data-user]::after{content:attr(data-user) '@incidentlab:~$ ';font-size:13px}
          </style>''', 1)
              s = s.replace('<body>', '''<body><div id="nicknameModal"><div class="nicknameBox"><h2>Welcome to IncidentLab</h2><p>Choose a unique nickname. It will be used for your profile and future leaderboard.</p><form id="nicknameForm"><input id="nicknameInput" class="nicknameInput" maxlength="20" autocomplete="off" placeholder="e.g. olga_dev"><div id="nicknameError" class="nicknameError"></div><div class="nicknameActions"><button class="btn" id="nicknameContinue" type="submit">Continue</button></div></form></div></div>''', 1)
              s = s.replace('<div class="top">', '<div class="top"><div><span id="playerBadge" class="badge" style="margin-right:8px"></span></div>', 1)
              s = s.replace('<div class="top"><div><span id="playerBadge" class="badge" style="margin-right:8px"></span></div><div><h1>IncidentLab</h1>', '<div class="top"><div><h1>IncidentLab</h1>', 1)
              s = s.replace('<div class="badge">INCIDENT #001 · ACTIVE</div>', '<div><span id="playerBadge" class="badge" style="margin-right:8px"></span><span class="badge">INCIDENT #001 · ACTIVE</span></div>', 1)
              script_marker = "const $=id=>document.getElementById(id),term=$('term'),inp=$('input'),hints=$('hints');"
              nickname_js = '''const SUPABASE_URL=window.INCIDENTLAB_SUPABASE_URL||'';const SUPABASE_KEY=window.INCIDENTLAB_SUPABASE_KEY||'';const nicknameModal=$('nicknameModal'),nicknameForm=$('nicknameForm'),nicknameInput=$('nicknameInput'),nicknameError=$('nicknameError'),nicknameContinue=$('nicknameContinue'),playerBadge=$('playerBadge');let promptObserver=null;function refreshTerminalPrompt(n){document.querySelectorAll('.prompt').forEach(p=>p.dataset.user=n)}function watchTerminalPrompts(n){refreshTerminalPrompt(n);if(promptObserver)promptObserver.disconnect();const target=document.getElementById('term');if(target)promptObserver=new MutationObserver(()=>refreshTerminalPrompt(n));if(promptObserver)promptObserver.observe(target,{childList:true,subtree:true})}function showNickname(){nicknameModal.classList.remove('hidden');nicknameError.textContent='';setTimeout(()=>nicknameInput.focus(),50)}function setPlayer(n,id){localStorage.setItem('incidentlab_nickname',n);if(id)localStorage.setItem('incidentlab_player_id',id);playerBadge.textContent=n;nicknameModal.classList.add('hidden');watchTerminalPrompts(n)}async function registerNickname(){const raw=nicknameInput.value.trim();if(!/^[A-Za-z0-9_-]{2,20}$/.test(raw)){nicknameError.textContent='Use 2–20 characters: letters, numbers, _ or -';nicknameInput.focus();return}if(!SUPABASE_URL||!SUPABASE_KEY){nicknameError.textContent='Player service is not configured.';return}nicknameContinue.disabled=true;nicknameError.textContent='Checking nickname...';try{const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/register_nickname',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Accept':'application/json'},body:JSON.stringify({p_nickname:raw})});const text=await res.text();let data=null;try{data=JSON.parse(text)}catch(_){}if(!res.ok)throw new Error((data&&data.message)||(data&&data.error)||('HTTP '+res.status));if(Array.isArray(data))data=data[0];if(!data||data.success!==true){nicknameError.textContent=(data&&data.error)||'Nickname is already taken';return}setPlayer(data.nickname||raw,data.id)}catch(e){console.error('Nickname registration failed',e);nicknameError.textContent='Could not connect to the player service. Try again.'}finally{nicknameContinue.disabled=false}}nicknameForm.addEventListener('submit',e=>{e.preventDefault();registerNickname()});nicknameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nicknameForm.requestSubmit()}});const savedNickname=localStorage.getItem('incidentlab_nickname');if(savedNickname){playerBadge.textContent=savedNickname;nicknameModal.classList.add('hidden');watchTerminalPrompts(savedNickname)}else{showNickname()}''' + script_marker
              s = s.replace(script_marker, nickname_js, 1)
              p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
