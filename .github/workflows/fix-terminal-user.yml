name: Fix terminal prompt username

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace personal username
        run: |
          if grep -q 'olga@incidentlab' index.html; then
            sed -i 's/olga@incidentlab/user@incidentlab/g' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Use generic terminal username'
            git push
          else
            echo 'Already using generic username'
          fi
