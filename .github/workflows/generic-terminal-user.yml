name: Make terminal prompt generic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-prompt:
    if: github.event.head_commit.message != 'chore: use generic terminal user'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace terminal username
        run: |
          sed -i 's/olga@incidentlab:~\$/user@incidentlab:~\$/g' index.html
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: use generic terminal user'
          git push
